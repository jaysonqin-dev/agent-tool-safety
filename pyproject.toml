[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-tool-safety"
version = "0.1.0"
description = "A small safety layer for tool-using AI agents that write to team systems, with a mock spreadsheet API."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[tool.setuptools.packages.find]
include = ["agent_tool_safety*"]
